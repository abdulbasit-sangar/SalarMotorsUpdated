<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14171C" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Website Title -->
    <title>SalarMotors | Premium Imported Vehicle Marketplace</title>

    <!-- SEO -->
    <meta
      name="description"
      content="SalarMotors is a trusted marketplace for verified imported vehicles. Browse, compare, and find quality cars with confidence."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="SalarMotors | Premium Imported Vehicle Marketplace"
    />
    <meta
      property="og:description"
      content="Discover verified imported vehicles with SalarMotors. Search by brand, model, price, and location."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SalarMotors | Premium Imported Vehicle Marketplace"
    />
    <meta
      name="twitter:description"
      content="Browse verified imported vehicles on SalarMotors."
    />

    <!-- Fonts: Inter only (spec requirement #7 — single primary font,
         previously loaded Big Shoulders Display + Inter + IBM Plex Mono).
         Weights 400–800 cover body text through the heaviest headings. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-graphite-950 text-bone font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
